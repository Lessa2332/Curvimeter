<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0A0E17" id="theme-color-meta">
    <meta name="description" content="Курвіметр — цифровий симулятор вимірювання відстаней на карті">
    <title>Курвіметр · Мобільний вимірювач</title>

    <!-- Leaflet CSS/JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --bg: #0A0E17;
            --surface: rgba(20, 30, 40, 0.85);
            --surface-glass: rgba(20, 30, 40, 0.6);
            --text: #E0E8F0;
            --text-secondary: #A0B0C0;
            --text-muted: #6B7A8A;
            --border: rgba(100, 160, 200, 0.25);
            --primary: #00FF9F;
            --primary-hover: #00CC7A;
            --primary-glow: rgba(0, 255, 159, 0.35);
            --accent: #00D4FF;
            --danger: #FF4D6A;
            --warning: #FFB74D;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 255, 159, 0.1);
            --radius: 16px;
            --radius-sm: 10px;
            --header-height: 56px;
            --font-stack: 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, 'Roboto', sans-serif;
            --transition: 200ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="light"] {
            --bg: #E8EEF4;
            --surface: rgba(255, 255, 255, 0.85);
            --surface-glass: rgba(255, 255, 255, 0.6);
            --text: #1A2B3C;
            --text-secondary: #3A4A5A;
            --text-muted: #6B7A8A;
            --border: rgba(60, 80, 100, 0.2);
            --primary: #00897B;
            --primary-hover: #00695C;
            --primary-glow: rgba(0, 137, 123, 0.25);
            --accent: #0288D1;
            --danger: #D32F2F;
            --warning: #F57C00;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: 16px;
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-stack);
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            overflow: hidden;
            height: 100dvh;
            height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.3s ease, color 0.3s ease;
            touch-action: manipulation;
        }

        .skip-link {
            position: absolute;
            top: -100%;
            left: 8px;
            z-index: 10000;
            background: var(--primary);
            color: #0A0E17;
            padding: 10px 18px;
            border-radius: var(--radius-sm);
            text-decoration: none;
            font-weight: 700;
            transition: top 0.2s ease;
        }
        .skip-link:focus {
            top: 8px;
        }

        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            height: var(--header-height);
            background: var(--surface-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            z-index: 500;
        }
        .app-header .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text);
        }
        .app-header .logo svg {
            width: 28px;
            height: 28px;
            fill: var(--primary);
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 44px;
            min-width: 44px;
            padding: 10px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            background: var(--surface-glass);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            color: var(--text);
            transition: all var(--transition);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            flex-shrink: 0;
            outline: none;
        }
        .btn:hover {
            background: var(--surface);
            border-color: var(--primary);
            box-shadow: 0 0 12px var(--primary-glow);
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn:focus-visible {
            box-shadow: 0 0 0 3px var(--accent);
        }
        .btn--primary {
            background: var(--primary);
            color: #0A0E17;
            border-color: transparent;
            box-shadow: 0 0 15px var(--primary-glow);
        }
        .btn--primary:hover {
            background: var(--primary-hover);
        }
        .btn--danger {
            background: rgba(255, 77, 106, 0.15);
            color: var(--danger);
            border-color: rgba(255, 77, 106, 0.4);
        }
        .btn--sm {
            min-height: 36px;
            min-width: 36px;
            padding: 6px 12px;
            font-size: 0.82rem;
        }
        .btn--icon {
            min-width: 44px;
            min-height: 44px;
            padding: 0;
            font-size: 1.3rem;
            border-radius: 50%;
        }
        .btn:disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        .main-container {
            flex: 1;
            min-height: 0;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .mode-tabs {
            display: flex;
            gap: 4px;
            background: var(--surface-glass);
            border-radius: var(--radius-sm);
            padding: 4px;
            margin: 8px 16px;
            border: 1px solid var(--border);
        }
        .mode-tab {
            flex: 1;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            text-align: center;
            font-weight: 600;
            font-size: 0.82rem;
            cursor: pointer;
            border: none;
            background: transparent;
            color: var(--text-muted);
            transition: all var(--transition);
            font-family: inherit;
        }
        .mode-tab.active {
            background: var(--primary);
            color: #0A0E17;
            box-shadow: 0 0 10px var(--primary-glow);
        }
        .mode-tab:hover:not(.active) {
            color: var(--text);
            background: var(--surface);
        }

        .view-container {
            flex: 1;
            min-height: 0;
            position: relative;
            display: none;
        }
        .view-container.active {
            display: flex;
        }

        .map-area {
            position: relative;
            flex: 1;
            min-height: 0;
            overflow: hidden;
            background: #0F1520;
        }
        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0F1520;
        }
        #drawing-canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 500;
            pointer-events: none;
            touch-action: none;
            cursor: crosshair;
        }
        #drawing-canvas.active {
            pointer-events: auto;
        }

        .camera-container {
            flex: 1;
            min-height: 0;
            position: relative;
            overflow: hidden;
            background: #000;
        }
        #camera-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }
        #camera-canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 500;
            pointer-events: auto;
            touch-action: none;
            cursor: crosshair;
        }

        .result-panel {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 600;
            background: var(--surface-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 10px 18px;
            min-width: 180px;
            max-width: calc(100% - 24px);
            text-align: center;
            border: 1px solid var(--border);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .result-panel.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .result-panel .result-value {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary-glow);
            font-variant-numeric: tabular-nums;
        }
        .result-panel .result-unit {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        .result-panel .result-status {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .bottom-controls {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 550;
            background: var(--surface-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            padding: 12px 16px;
            width: calc(100% - 24px);
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .controls-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .hint-text {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-align: center;
        }

        .scale-input-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .scale-input-row label {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-secondary);
        }
        .scale-input-row input {
            width: 100px;
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--surface);
            color: var(--text);
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
        }
        .scale-input-row input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.2);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }
        .modal {
            background: var(--surface-glass);
            backdrop-filter: blur(12px);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px;
            width: 100%;
            max-width: 420px;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid var(--border);
        }
        .modal h2 {
            font-size: 1.2rem;
            margin-bottom: 16px;
            color: var(--text);
        }
        .modal .form-group {
            margin-bottom: 14px;
        }
        .modal label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-secondary);
        }
        .modal select,
        .modal input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--surface);
            color: var(--text);
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
        }
        .modal .modal-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
        .sr-live {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        .leaflet-container {
            font-family: var(--font-stack);
            background: #0F1520;
        }
        .leaflet-control-zoom a {
            background: var(--surface-glass) !important;
            color: var(--text) !important;
            border-color: var(--border) !important;
        }

        @media (max-width: 480px) {
            .result-panel {
                padding: 8px 12px;
                min-width: 140px;
            }
            .result-panel .result-value {
                font-size: 1.3rem;
            }
            .bottom-controls {
                padding: 8px 8px;
                bottom: 8px;
                width: calc(100% - 16px);
            }
            .btn {
                min-height: 40px;
                min-width: 40px;
                padding: 8px 10px;
                font-size: 0.78rem;
            }
            .mode-tab {
                padding: 6px 8px;
                font-size: 0.72rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

    <a href="#main-content" class="skip-link">Перейти до основного вмісту</a>
    <div id="sr-live" class="sr-live" aria-live="polite" aria-atomic="true"></div>

    <!-- Header -->
    <header class="app-header" role="banner">
        <div class="logo">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C7.58 2 4 5.58 4 10c0 4.5 4.5 9.5 7 11.5 0.3 0.25 0.7 0.25 1 0C14.5 19.5 19 14.5 19 10c0-4.42-3.58-8-8-8zm0 11.5A3.5 3.5 0 1 1 12 6a3.5 3.5 0 0 1 0 7.5z"/></svg>
            <span>КУРВІМЕТР</span>
        </div>
        <div class="header-actions">
            <button id="btn-settings" class="btn btn--sm" aria-label="Налаштування" title="Налаштування">
                <span aria-hidden="true">⚙️</span>
                <span class="btn-label">Налаштування</span>
            </button>
            <button id="btn-theme" class="btn btn--icon btn--sm" aria-label="Перемкнути тему" title="Перемкнути тему">
                <span id="theme-icon" aria-hidden="true">☀️</span>
            </button>
        </div>
    </header>

    <main class="main-container" id="main-content">
        <!-- Mode Tabs -->
        <div class="mode-tabs" role="tablist" aria-label="Режим роботи">
            <button class="mode-tab active" data-mode="digital" role="tab" aria-selected="true">🗺️ Цифрова карта</button>
            <button class="mode-tab" data-mode="camera" role="tab" aria-selected="false">📷 Фізична карта</button>
        </div>

        <!-- Digital Map View -->
        <div class="view-container active" id="view-digital">
            <div class="map-area" id="map-area">
                <div id="map"></div>
                <canvas id="drawing-canvas"></canvas>

                <div id="result-panel-digital" class="result-panel" role="status" aria-live="polite">
                    <div class="result-status" id="result-status-digital">Готово</div>
                    <div class="result-value" id="result-value-digital">0 <span class="result-unit" id="result-unit-digital">м</span></div>
                </div>

                <div class="bottom-controls">
                    <div class="controls-row">
                        <button id="btn-activate-digital" class="btn btn--primary" aria-pressed="false">
                            <span aria-hidden="true">🧵</span>
                            <span class="btn-label">Активувати нитку</span>
                        </button>
                    </div>
                    <div class="controls-row" id="drawing-controls-digital" style="display:none;">
                        <button id="btn-undo-digital" class="btn btn--sm" aria-label="Скасувати">↩️ Скасувати</button>
                        <button id="btn-clear-digital" class="btn btn--danger btn--sm" aria-label="Очистити">🧹 Очистити</button>
                        <button id="btn-finish-digital" class="btn btn--primary btn--sm" aria-label="Завершити">✅ Завершити</button>
                    </div>
                    <div class="hint-text" id="hint-digital">Натисніть «Активувати нитку» і ведіть пальцем по карті</div>
                </div>
            </div>
        </div>

        <!-- Camera View -->
        <div class="view-container" id="view-camera">
            <div class="camera-container" id="camera-container">
                <video id="camera-video" autoplay playsinline muted></video>
                <canvas id="camera-canvas"></canvas>

                <div id="result-panel-camera" class="result-panel" role="status" aria-live="polite">
                    <div class="result-status" id="result-status-camera">Готово</div>
                    <div class="result-value" id="result-value-camera">0 <span class="result-unit" id="result-unit-camera">м</span></div>
                </div>

                <div class="bottom-controls">
                    <div class="scale-input-row">
                        <label for="camera-scale-input">Масштаб (1:)</label>
                        <input type="number" id="camera-scale-input" value="50000" min="1" step="1000" aria-label="Масштаб карти">
                    </div>
                    <div class="controls-row">
                        <button id="btn-activate-thread" class="btn btn--primary" aria-pressed="false">
                            <span aria-hidden="true">🧵</span>
                            <span class="btn-label">Активувати нитку</span>
                        </button>
                    </div>
                    <div class="controls-row" id="thread-controls" style="display:none;">
                        <button id="btn-pause-thread" class="btn btn--sm" aria-label="Пауза">
                            <span aria-hidden="true">⏸️</span>
                            <span class="btn-label">Пауза</span>
                        </button>
                        <button id="btn-finish-thread" class="btn btn--primary btn--sm" aria-label="Завершити">
                            <span aria-hidden="true">✅</span>
                            <span class="btn-label">Завершити</span>
                        </button>
                        <button id="btn-clear-thread" class="btn btn--danger btn--sm" aria-label="Очистити">
                            <span aria-hidden="true">🧹</span>
                        </button>
                    </div>
                    <div class="hint-text" id="hint-camera">Торкніться карти і ведіть пальцем — нитка буде слідувати</div>
                </div>
            </div>
        </div>
    </main>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div class="modal">
            <h2 id="settings-title">⚙️ Налаштування</h2>
            <div class="form-group">
                <label for="setting-units">Одиниці виміру</label>
                <select id="setting-units">
                    <option value="metric">Метрична (м / км)</option>
                    <option value="imperial">Імперська (фути / милі)</option>
                    <option value="nautical">Морські милі</option>
                </select>
            </div>
            <div class="form-group">
                <label for="setting-high-contrast">Високий контраст</label>
                <select id="setting-high-contrast">
                    <option value="false">Звичайний</option>
                    <option value="true">Високий контраст</option>
                </select>
            </div>
            <div class="form-group">
                <label for="setting-haptic">Вібрація</label>
                <select id="setting-haptic">
                    <option value="false">Вимкнено</option>
                    <option value="true">Увімкнено</option>
                </select>
            </div>
            <div class="modal-actions">
                <button id="btn-settings-close" class="btn">Закрити</button>
                <button id="btn-settings-save" class="btn btn--primary">Зберегти</button>
            </div>
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        // ===== State =====
        const state = {
            theme: 'dark',
            units: 'metric',
            highContrast: false,
            haptic: false,
            mode: 'digital',
            digitalActive: false,
            isDrawing: false,
            points: [],
            totalLengthM: 0,
            cameraActive: false,
            threadMode: false,
            threadPoints: [],
            threadSegments: [],
            threadTotalLength: 0,
            threadActive: false,
            threadPaused: false,
            threadStartPoint: null,
            threadCurrentPoint: null,
            cameraScale: 50000,
            cameraStream: null,
        };

        // ===== DOM =====
        const srLive = document.getElementById('sr-live');
        const canvasDigital = document.getElementById('drawing-canvas');
        const ctxDigital = canvasDigital.getContext('2d');
        const canvasCamera = document.getElementById('camera-canvas');
        const ctxCamera = canvasCamera.getContext('2d');
        const video = document.getElementById('camera-video');
        const btnActivateDigital = document.getElementById('btn-activate-digital');
        const drawingControlsDigital = document.getElementById('drawing-controls-digital');
        const btnUndoDigital = document.getElementById('btn-undo-digital');
        const btnClearDigital = document.getElementById('btn-clear-digital');
        const btnFinishDigital = document.getElementById('btn-finish-digital');
        const btnActivateThread = document.getElementById('btn-activate-thread');
        const threadControls = document.getElementById('thread-controls');
        const btnPauseThread = document.getElementById('btn-pause-thread');
        const btnFinishThread = document.getElementById('btn-finish-thread');
        const btnClearThread = document.getElementById('btn-clear-thread');
        const hintDigital = document.getElementById('hint-digital');
        const hintCamera = document.getElementById('hint-camera');
        const cameraScaleInput = document.getElementById('camera-scale-input');
        const settingsModal = document.getElementById('settings-modal');
        const settingUnits = document.getElementById('setting-units');
        const settingHighContrast = document.getElementById('setting-high-contrast');
        const settingHaptic = document.getElementById('setting-haptic');
        const btnTheme = document.getElementById('btn-theme');
        const themeIcon = document.getElementById('theme-icon');
        const resultPanelDigital = document.getElementById('result-panel-digital');
        const resultValueDigital = document.getElementById('result-value-digital');
        const resultStatusDigital = document.getElementById('result-status-digital');
        const resultPanelCamera = document.getElementById('result-panel-camera');
        const resultValueCamera = document.getElementById('result-value-camera');
        const resultStatusCamera = document.getElementById('result-status-camera');

        // ===== Map =====
        const map = L.map('map', {
            center: [49.0, 31.0],
            zoom: 6,
            zoomControl: true,
            attributionControl: true,
        });
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        }).addTo(map);
        L.control.scale({ position: 'bottomleft', imperial: false }).addTo(map);

        // ===== Utility Functions =====
        function announceSR(message) {
            srLive.textContent = '';
            setTimeout(() => { srLive.textContent = message; }, 50);
        }

        function formatLength(meters) {
            if (meters < 1000) {
                return { value: Math.round(meters) + '', unit: 'м', raw: meters };
            }
            return { value: (meters / 1000).toFixed(2), unit: 'км', raw: meters };
        }

        function haversineDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function pixelsToMeters(px, scale) {
            const pxPerCm = 37.8;
            const cmOnMap = px / pxPerCm;
            const cmOnGround = cmOnMap * scale;
            return cmOnGround / 100;
        }

        // ===== Theme =====
        function applyTheme(theme) {
            state.theme = theme;
            document.documentElement.setAttribute('data-theme', theme);
            themeIcon.textContent = theme === 'dark' ? '☀️' : '🌙';
            document.getElementById('theme-color-meta').setAttribute('content', theme === 'dark' ? '#0A0E17' : '#E8EEF4');
            localStorage.setItem('curvimeter_theme', theme);
        }

        function cycleTheme() {
            const next = state.theme === 'dark' ? 'light' : 'dark';
            applyTheme(next);
            announceSR('Тему змінено на ' + (next === 'dark' ? 'темну' : 'світлу'));
        }

        // ===== Digital Canvas =====
        function resizeDigitalCanvas() {
            const rect = document.getElementById('map-area').getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvasDigital.width = rect.width * dpr;
            canvasDigital.height = rect.height * dpr;
            canvasDigital.style.width = rect.width + 'px';
            canvasDigital.style.height = rect.height + 'px';
            ctxDigital.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctxDigital.lineCap = 'round';
            ctxDigital.lineJoin = 'round';
            redrawDigitalCanvas();
        }

        function redrawDigitalCanvas() {
            const rect = document.getElementById('map-area').getBoundingClientRect();
            ctxDigital.clearRect(0, 0, rect.width, rect.height);
            if (state.points.length === 0) return;

            const lineColor = state.highContrast ? '#FFD54F' : (state.theme === 'dark' ? '#00FF9F' : '#00897B');
            const outlineColor = state.theme === 'dark' ? '#0A0E17' : '#FFFFFF';
            const lw = 3;

            ctxDigital.strokeStyle = outlineColor;
            ctxDigital.lineWidth = lw + 2;
            ctxDigital.beginPath();
            ctxDigital.moveTo(state.points[0].x, state.points[0].y);
            for (let i = 1; i < state.points.length; i++) {
                ctxDigital.lineTo(state.points[i].x, state.points[i].y);
            }
            ctxDigital.stroke();

            ctxDigital.strokeStyle = lineColor;
            ctxDigital.lineWidth = lw;
            ctxDigital.beginPath();
            ctxDigital.moveTo(state.points[0].x, state.points[0].y);
            for (let i = 1; i < state.points.length; i++) {
                ctxDigital.lineTo(state.points[i].x, state.points[i].y);
            }
            ctxDigital.stroke();

            const last = state.points[state.points.length - 1];
            ctxDigital.fillStyle = lineColor;
            ctxDigital.strokeStyle = outlineColor;
            ctxDigital.lineWidth = 1.5;
            ctxDigital.beginPath();
            ctxDigital.arc(last.x, last.y, lw + 2, 0, Math.PI * 2);
            ctxDigital.fill();
            ctxDigital.stroke();
        }

        function recalculateDigitalLength() {
            state.totalLengthM = 0;
            for (let i = 1; i < state.points.length; i++) {
                state.totalLengthM += haversineDistance(
                    state.points[i - 1].lat, state.points[i - 1].lng,
                    state.points[i].lat, state.points[i].lng
                );
            }
        }

        function updateDigitalResult(status) {
            const formatted = formatLength(state.totalLengthM);
            resultValueDigital.innerHTML = formatted.value + ' <span class="result-unit">' + formatted.unit + '</span>';
            resultStatusDigital.textContent = status || (state.isDrawing ? 'Вимірювання...' : (state.points.length > 0 ? 'Завершено' : 'Готово'));
            if (state.totalLengthM > 0 || state.isDrawing) {
                resultPanelDigital.classList.add('visible');
            } else {
                resultPanelDigital.classList.remove('visible');
            }
        }

        // ===== Digital Thread Tool =====
        function activateDigital() {
            if (state.digitalActive) return;
            state.digitalActive = true;
            state.isDrawing = false;
            state.points = [];
            state.totalLengthM = 0;
            canvasDigital.classList.add('active');
            map.dragging.disable();
            map.touchZoom.disable();
            map.scrollWheelZoom.disable();
            map.doubleClickZoom.disable();
            btnActivateDigital.setAttribute('aria-pressed', 'true');
            btnActivateDigital.innerHTML = '<span aria-hidden="true">✅</span><span class="btn-label">Нитка активна</span>';
            btnActivateDigital.classList.remove('btn--primary');
            btnActivateDigital.classList.add('btn--danger');
            drawingControlsDigital.style.display = 'flex';
            hintDigital.textContent = '🧵 Ведіть пальцем по карті — нитка буде слідувати';
            updateDigitalResult('Готово до вимірювання');
            announceSR('Нитка активована. Ведіть пальцем по карті.');
        }

        function deactivateDigital() {
            if (!state.digitalActive) return;
            state.digitalActive = false;
            state.isDrawing = false;
            canvasDigital.classList.remove('active');
            map.dragging.enable();
            map.touchZoom.enable();
            map.scrollWheelZoom.enable();
            map.doubleClickZoom.enable();
            btnActivateDigital.setAttribute('aria-pressed', 'false');
            btnActivateDigital.innerHTML = '<span aria-hidden="true">🧵</span><span class="btn-label">Активувати нитку</span>';
            btnActivateDigital.classList.add('btn--primary');
            btnActivateDigital.classList.remove('btn--danger');
            drawingControlsDigital.style.display = 'none';
            hintDigital.textContent = 'Натисніть «Активувати нитку» і ведіть пальцем по карті';
            if (state.points.length > 0) {
                updateDigitalResult('Завершено');
            } else {
                resultPanelDigital.classList.remove('visible');
            }
            announceSR('Нитка деактивована.');
        }

        function clearDigital() {
            state.points = [];
            state.totalLengthM = 0;
            state.isDrawing = false;
            updateDigitalResult('Готово');
            redrawDigitalCanvas();
            announceSR('Маршрут очищено.');
        }

        function undoDigital() {
            if (state.points.length === 0) return;
            const removeCount = Math.min(15, state.points.length);
            state.points.splice(state.points.length - removeCount, removeCount);
            recalculateDigitalLength();
            if (state.points.length === 0) {
                state.totalLengthM = 0;
                resultPanelDigital.classList.remove('visible');
            } else {
                updateDigitalResult(state.isDrawing ? 'Вимірювання...' : 'Завершено');
            }
            redrawDigitalCanvas();
            announceSR('Скасовано останній сегмент.');
        }

        function finishDigital() {
            if (state.points.length === 0) return;
            state.isDrawing = false;
            recalculateDigitalLength();
            updateDigitalResult('Завершено');
            if (state.haptic && navigator.vibrate) navigator.vibrate(40);
            const formatted = formatLength(state.totalLengthM);
            announceSR('Маршрут завершено. Довжина: ' + formatted.value + ' ' + formatted.unit);
            redrawDigitalCanvas();
        }

        // ===== Camera Thread Tool =====
        function updateCameraResult(status) {
            const formatted = formatLength(state.threadTotalLength);
            resultValueCamera.innerHTML = formatted.value + ' <span class="result-unit">' + formatted.unit + '</span>';
            resultStatusCamera.textContent = status || (state.threadActive ? 'Вимірювання...' : (state.threadSegments.length > 0 ? 'Завершено' : 'Готово'));
            if (state.threadTotalLength > 0 || state.threadActive) {
                resultPanelCamera.classList.add('visible');
            } else {
                resultPanelCamera.classList.remove('visible');
            }
        }

        function resizeCameraCanvas() {
            const rect = document.getElementById('camera-container').getBoundingClientRect();
            canvasCamera.width = rect.width;
            canvasCamera.height = rect.height;
            canvasCamera.style.width = rect.width + 'px';
            canvasCamera.style.height = rect.height + 'px';
            redrawCameraCanvas();
        }

        function redrawCameraCanvas() {
            const rect = document.getElementById('camera-container').getBoundingClientRect();
            ctxCamera.clearRect(0, 0, rect.width, rect.height);
            if (state.threadSegments.length === 0) return;

            const lineColor = state.highContrast ? '#FFD54F' : '#00FF9F';
            const lw = 4;

            // Малюємо всі сегменти нитки
            state.threadSegments.forEach((segment, index) => {
                if (segment.points.length < 2) return;
                
                const alpha = 1 - (index * 0.1);
                ctxCamera.strokeStyle = lineColor;
                ctxCamera.globalAlpha = Math.max(alpha, 0.3);
                ctxCamera.lineWidth = lw;
                ctxCamera.lineCap = 'round';
                ctxCamera.lineJoin = 'round';
                
                ctxCamera.beginPath();
                ctxCamera.moveTo(segment.points[0].x, segment.points[0].y);
                for (let i = 1; i < segment.points.length; i++) {
                    ctxCamera.lineTo(segment.points[i].x, segment.points[i].y);
                }
                ctxCamera.stroke();
            });

            // Малюємо точки з'єднання
            state.threadSegments.forEach((segment, index) => {
                if (index > 0 && segment.continuedFrom !== undefined) {
                    const startPoint = segment.points[0];
                    ctxCamera.globalAlpha = 1;
                    ctxCamera.fillStyle = '#FFD54F';
                    ctxCamera.beginPath();
                    ctxCamera.arc(startPoint.x, startPoint.y, 6, 0, Math.PI * 2);
                    ctxCamera.fill();
                    
                    // Пунктирне коло
                    ctxCamera.strokeStyle = '#FFD54F';
                    ctxCamera.lineWidth = 2;
                    ctxCamera.setLineDash([5, 5]);
                    ctxCamera.beginPath();
                    ctxCamera.arc(startPoint.x, startPoint.y, 10, 0, Math.PI * 2);
                    ctxCamera.stroke();
                    ctxCamera.setLineDash([]);
                }
            });

            // Малюємо кінчик нитки
            if (state.threadCurrentPoint && state.threadActive) {
                ctxCamera.globalAlpha = 1;
                ctxCamera.fillStyle = '#FFFFFF';
                ctxCamera.strokeStyle = lineColor;
                ctxCamera.lineWidth = 2;
                ctxCamera.beginPath();
                ctxCamera.arc(state.threadCurrentPoint.x, state.threadCurrentPoint.y, 8, 0, Math.PI * 2);
                ctxCamera.fill();
                ctxCamera.stroke();
            }
            
            ctxCamera.globalAlpha = 1;
        }

        function activateThreadMode() {
            if (state.threadMode) return;
            state.threadMode = true;
            state.threadSegments = [];
            state.threadTotalLength = 0;
            state.threadActive = false;
            state.threadPaused = false;
            
            btnActivateThread.setAttribute('aria-pressed', 'true');
            btnActivateThread.innerHTML = '<span aria-hidden="true">✅</span><span class="btn-label">Нитка активна</span>';
            btnActivateThread.classList.remove('btn--primary');
            btnActivateThread.classList.add('btn--danger');
            threadControls.style.display = 'flex';
            btnPauseThread.disabled = true;
            btnFinishThread.disabled = true;
            
            hintCamera.textContent = '🧵 Торкніться карти і ведіть пальцем — нитка буде слідувати';
            updateCameraResult('Готово до вимірювання');
            announceSR('Режим нитки активовано. Торкніться карти для початку.');
        }

        function deactivateThreadMode() {
            if (!state.threadMode) return;
            state.threadMode = false;
            state.threadActive = false;
            state.threadPaused = false;
            
            btnActivateThread.setAttribute('aria-pressed', 'false');
            btnActivateThread.innerHTML = '<span aria-hidden="true">🧵</span><span class="btn-label">Активувати нитку</span>';
            btnActivateThread.classList.add('btn--primary');
            btnActivateThread.classList.remove('btn--danger');
            threadControls.style.display = 'none';
            
            hintCamera.textContent = 'Торкніться карти і ведіть пальцем — нитка буде слідувати';
            announceSR('Режим нитки деактивовано.');
        }

        function startThread(x, y) {
            if (!state.threadMode) return;
            
            state.threadActive = true;
            state.threadPaused = false;
            state.threadStartPoint = { x, y };
            state.threadCurrentPoint = { x, y };
            
            state.threadSegments.push({
                start: { x, y },
                points: [{ x, y }],
                lengthPx: 0,
                lengthM: 0
            });
            
            btnPauseThread.disabled = false;
            btnFinishThread.disabled = false;
            
            hintCamera.textContent = '🧵 Нитка почалась! Ведіть пальцем по карті.';
            announceSR('Нитка почалась. Ведіть пальцем.');
            
            if (state.haptic && navigator.vibrate) navigator.vibrate(15);
        }

        function continueThread(x, y) {
            if (!state.threadActive || state.threadPaused) return;
            
            const lastPoint = state.threadSegments[state.threadSegments.length - 1].points[
                state.threadSegments[state.threadSegments.length - 1].points.length - 1
            ];
            const distPx = Math.sqrt((x - lastPoint.x) ** 2 + (y - lastPoint.y) ** 2);
            
            if (distPx > 2) {
                const currentSegment = state.threadSegments[state.threadSegments.length - 1];
                currentSegment.points.push({ x, y });
                currentSegment.lengthPx += distPx;
                currentSegment.lengthM = pixelsToMeters(currentSegment.lengthPx, state.cameraScale);
                
                state.threadCurrentPoint = { x, y };
                
                recalculateThreadLength();
                updateCameraResult('Вимірювання...');
                redrawCameraCanvas();
                
                if (state.haptic && navigator.vibrate && distPx > 5) {
                    navigator.vibrate(2);
                }
            }
        }

        function pauseThread() {
            if (!state.threadActive || state.threadPaused) return;
            
            state.threadPaused = true;
            
            hintCamera.textContent = '⏸️ Нитка на паузі. Перемістіть карту, потім торкніться для продовження.';
            announceSR('Нитка на паузі. Перемістіть карту і торкніться для продовження.');
            
            btnPauseThread.innerHTML = '<span aria-hidden="true">▶️</span><span class="btn-label">Продовжити</span>';
        }

        function resumeThread(x, y) {
            if (!state.threadActive || !state.threadPaused) return;
            
            state.threadPaused = false;
            
            state.threadSegments.push({
                start: { x, y },
                points: [{ x, y }],
                lengthPx: 0,
                lengthM: 0,
                continuedFrom: state.threadSegments.length - 1
            });
            
            state.threadCurrentPoint = { x, y };
            
            hintCamera.textContent = '🧵 Нитка продовжена! Ведіть пальцем далі.';
            announceSR('Нитка продовжена.');
            
            btnPauseThread.innerHTML = '<span aria-hidden="true">⏸️</span><span class="btn-label">Пауза</span>';
            
            redrawCameraCanvas();
            if (state.haptic && navigator.vibrate) navigator.vibrate(20);
        }

        function finishThread() {
            if (!state.threadActive) return;
            
            state.threadActive = false;
            
            recalculateThreadLength();
            
            const formatted = formatLength(state.threadTotalLength);
            
            hintCamera.textContent = '✅ Нитка завершена! Довжина: ' + formatted.value + ' ' + formatted.unit;
            announceSR('Вимірювання завершено. Загальна довжина: ' + formatted.value + ' ' + formatted.unit);
            
            updateCameraResult('Завершено');
            
            btnPauseThread.disabled = true;
            btnFinishThread.disabled = true;
            
            if (state.haptic && navigator.vibrate) navigator.vibrate([30, 50, 30]);
            
            redrawCameraCanvas();
        }

        function clearThread() {
            state.threadSegments = [];
            state.threadTotalLength = 0;
            state.threadActive = false;
            state.threadPaused = false;
            
            updateCameraResult('Готово');
            redrawCameraCanvas();
            
            btnPauseThread.disabled = true;
            btnFinishThread.disabled = true;
            btnPauseThread.innerHTML = '<span aria-hidden="true">⏸️</span><span class="btn-label">Пауза</span>';
            
            hintCamera.textContent = 'Торкніться карти і ведіть пальцем — нитка буде слідувати';
            announceSR('Нитку очищено.');
        }

        function recalculateThreadLength() {
            state.threadTotalLength = 0;
            state.threadSegments.forEach(segment => {
                state.threadTotalLength += segment.lengthM;
            });
        }

        function handleCameraCanvasPointerDown(e) {
            if (!state.threadMode) return;
            e.preventDefault();
            
            const rect = canvasCamera.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            if (!state.threadActive) {
                startThread(x, y);
            } else if (state.threadPaused) {
                resumeThread(x, y);
            }
            
            canvasCamera.setPointerCapture(e.pointerId);
        }

        function handleCameraCanvasPointerMove(e) {
            if (!state.threadMode || !state.threadActive || state.threadPaused) return;
            e.preventDefault();
            
            const rect = canvasCamera.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            continueThread(x, y);
        }

        function handleCameraCanvasPointerUp(e) {
            if (!state.threadMode) return;
            if (canvasCamera.hasPointerCapture(e.pointerId)) {
                canvasCamera.releasePointerCapture(e.pointerId);
            }
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' },
                    audio: false
                });
                state.cameraStream = stream;
                video.srcObject = stream;
                await video.play();
                resizeCameraCanvas();
                announceSR('Камера увімкнена. Наведіть на карту.');
            } catch (err) {
                console.error('Camera error:', err);
                hintCamera.textContent = 'Помилка доступу до камери. Перевірте дозволи.';
                announceSR('Помилка доступу до камери.');
            }
        }

        function stopCamera() {
            if (state.cameraStream) {
                state.cameraStream.getTracks().forEach(track => track.stop());
                state.cameraStream = null;
                video.srcObject = null;
            }
        }

        // ===== Mode Switching =====
        function switchMode(mode) {
            state.mode = mode;
            document.querySelectorAll('.mode-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.mode === mode);
                tab.setAttribute('aria-selected', tab.dataset.mode === mode);
            });
            document.getElementById('view-digital').classList.toggle('active', mode === 'digital');
            document.getElementById('view-camera').classList.toggle('active', mode === 'camera');

            if (mode === 'camera') {
                deactivateDigital();
                startCamera();
                resizeCameraCanvas();
                updateCameraResult('Готово');
                if (state.threadMode) {
                    deactivateThreadMode();
                }
            } else {
                stopCamera();
                if (state.threadMode) {
                    deactivateThreadMode();
                }
                map.invalidateSize();
                resizeDigitalCanvas();
            }
        }

        // ===== Settings =====
        function loadSettings() {
            const theme = localStorage.getItem('curvimeter_theme') || 'dark';
            const units = localStorage.getItem('curvimeter_units') || 'metric';
            const highContrast = localStorage.getItem('curvimeter_high_contrast') === 'true';
            const haptic = localStorage.getItem('curvimeter_haptic') === 'true';
            state.theme = theme;
            state.units = units;
            state.highContrast = highContrast;
            state.haptic = haptic;
            settingUnits.value = units;
            settingHighContrast.value = highContrast ? 'true' : 'false';
            settingHaptic.value = haptic ? 'true' : 'false';
            applyTheme(theme);
        }

        function saveSettings() {
            state.units = settingUnits.value;
            state.highContrast = settingHighContrast.value === 'true';
            state.haptic = settingHaptic.value === 'true';
            localStorage.setItem('curvimeter_units', state.units);
            localStorage.setItem('curvimeter_high_contrast', state.highContrast);
            localStorage.setItem('curvimeter_haptic', state.haptic);
            updateDigitalResult();
            updateCameraResult();
            redrawDigitalCanvas();
            redrawCameraCanvas();
            settingsModal.classList.remove('open');
            announceSR('Налаштування збережено.');
        }

        // ===== Event Listeners =====
        btnActivateDigital.addEventListener('click', () => {
            if (state.digitalActive) {
                deactivateDigital();
            } else {
                activateDigital();
            }
        });

        btnUndoDigital.addEventListener('click', undoDigital);
        btnClearDigital.addEventListener('click', clearDigital);
        btnFinishDigital.addEventListener('click', finishDigital);

        btnActivateThread.addEventListener('click', () => {
            if (state.threadMode) {
                deactivateThreadMode();
            } else {
                activateThreadMode();
            }
        });
        btnPauseThread.addEventListener('click', () => {
            if (state.threadPaused) {
                hintCamera.textContent = 'Торкніться карти в місці продовження нитки.';
            } else {
                pauseThread();
            }
        });
        btnFinishThread.addEventListener('click', finishThread);
        btnClearThread.addEventListener('click', clearThread);

        btnTheme.addEventListener('click', cycleTheme);

        document.getElementById('btn-settings').addEventListener('click', () => {
            settingsModal.classList.add('open');
        });
        document.getElementById('btn-settings-close').addEventListener('click', () => {
            settingsModal.classList.remove('open');
        });
        document.getElementById('btn-settings-save').addEventListener('click', saveSettings);
        settingsModal.addEventListener('click', (e) => {
            if (e.target === settingsModal) settingsModal.classList.remove('open');
        });

        document.querySelectorAll('.mode-tab').forEach(tab => {
            tab.addEventListener('click', () => switchMode(tab.dataset.mode));
        });

        cameraScaleInput.addEventListener('input', () => {
            state.cameraScale = parseInt(cameraScaleInput.value, 10) || 50000;
            if (state.threadSegments.length > 0) {
                recalculateThreadLength();
                updateCameraResult('Завершено');
            }
        });

        // Digital canvas pointer events
        canvasDigital.addEventListener('pointerdown', (e) => {
            if (!state.digitalActive) return;
            e.preventDefault();
            state.isDrawing = true;
            state.points = [];
            state.totalLengthM = 0;
            const rect = canvasDigital.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const latlng = map.containerPointToLatLng([x, y]);
            state.points.push({ x, y, lat: latlng.lat, lng: latlng.lng });
            canvasDigital.setPointerCapture(e.pointerId);
            updateDigitalResult('Вимірювання...');
            redrawDigitalCanvas();
        });

        canvasDigital.addEventListener('pointermove', (e) => {
            if (!state.digitalActive || !state.isDrawing) return;
            e.preventDefault();
            const rect = canvasDigital.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const latlng = map.containerPointToLatLng([x, y]);
            const last = state.points[state.points.length - 1];
            const distPx = Math.sqrt((x - last.x) ** 2 + (y - last.y) ** 2);
            if (distPx > 3) {
                state.points.push({ x, y, lat: latlng.lat, lng: latlng.lng });
                recalculateDigitalLength();
                updateDigitalResult('Вимірювання...');
                redrawDigitalCanvas();
                if (state.haptic && navigator.vibrate && distPx > 10) {
                    navigator.vibrate(5);
                }
            }
        });

        canvasDigital.addEventListener('pointerup', (e) => {
            if (!state.digitalActive || !state.isDrawing) return;
            e.preventDefault();
            state.isDrawing = false;
            finishDigital();
            if (canvasDigital.hasPointerCapture(e.pointerId)) {
                canvasDigital.releasePointerCapture(e.pointerId);
            }
        });

        canvasDigital.addEventListener('pointercancel', (e) => {
            if (state.isDrawing) {
                state.isDrawing = false;
                finishDigital();
            }
        });

        // Camera canvas pointer events (thread mode)
        canvasCamera.addEventListener('pointerdown', handleCameraCanvasPointerDown);
        canvasCamera.addEventListener('pointermove', handleCameraCanvasPointerMove);
        canvasCamera.addEventListener('pointerup', handleCameraCanvasPointerUp);
        canvasCamera.addEventListener('pointercancel', handleCameraCanvasPointerUp);
        canvasCamera.addEventListener('contextmenu', (e) => e.preventDefault());

        // Resize observers
        const digitalResizeObserver = new ResizeObserver(() => {
            if (state.mode === 'digital') {
                resizeDigitalCanvas();
                map.invalidateSize();
            }
        });
        digitalResizeObserver.observe(document.getElementById('map-area'));

        const cameraResizeObserver = new ResizeObserver(() => {
            if (state.mode === 'camera') {
                resizeCameraCanvas();
            }
        });
        cameraResizeObserver.observe(document.getElementById('camera-container'));

        window.addEventListener('resize', () => {
            if (state.mode === 'digital') {
                resizeDigitalCanvas();
                map.invalidateSize();
            } else {
                resizeCameraCanvas();
            }
        });

        // ===== Init =====
        function init() {
            loadSettings();
            resizeDigitalCanvas();
            resizeCameraCanvas();
            map.invalidateSize();
            updateDigitalResult('Готово');
            updateCameraResult('Готово');
            btnPauseThread.disabled = true;
            btnFinishThread.disabled = true;
            announceSR('Курвіметр завантажено. Виберіть режим роботи.');
        }

        init();
    })();
    </script>
</body>
</html>
